# 极简静态托管配置：不配置任何上游代理或外部地址
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP 健康检查端点（供 Docker / Compose / 负载均衡探测）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
